uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 2400
  rx_buffer_size: 512

sensor:
  - platform: template
    name: "Napětí baterie"
    unit_of_measurement: "V"
    id: batt_voltage
    accuracy_decimals: 2
    icon: "mdi:battery"
    
  - platform: template
    name: "Výkon zátěže"
    unit_of_measurement: "W"
    id: load_power
    accuracy_decimals: 0
    icon: "mdi:speedometer"

  - platform: template
    name: "Napětí panelů"
    unit_of_measurement: "V"
    id: pv_voltage
    accuracy_decimals: 1
    icon: "mdi:solar-panel"

interval:
  - interval: 1s
    then:
      - lambda: |-
          static std::string buffer;
          uint8_t byte;
          while (id(uart_bus).available() > 0) {
            if (id(uart_bus).read_byte(&byte)) {
              char c = (char)byte;
              if (c == '\r') {
                float v_batt, p_load, v_pv;
                // VM III Mapa: (AC_In F_In AC_Out F_Out VA_Load W_Load %_Load Bus_V V_Batt I_Char Cap T_Heat I_PV V_PV
                if (sscanf(buffer.c_str(), "(%*f %*f %*f %*f %*f %f %*f %*f %f %*f %*f %*f %*f %f", 
                    &p_load, &v_batt, &v_pv) >= 2) {
                  id(batt_voltage).publish_state(v_batt);
                  id(load_power).publish_state(p_load);
                  id(pv_voltage).publish_state(v_pv);
                }
                buffer.clear();
              } else if (c != '\n') {
                buffer += c;
              }
            }
          }

  - interval: 10s
    then:
      - lambda: |-
          // QPIGS + CRC (0xB7 0xA9) + CR
          uint8_t qpigs[] = {'Q', 'P', 'I', 'G', 'S', 0xB7, 0xA9, 0x0D};
          id(uart_bus).write_array(qpigs, sizeof(qpigs));
