uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 2400
  rx_buffer_size: 512

sensor:
  - platform: template
    name: "Napětí baterie"
    unit_of_measurement: "V"
    id: batt_voltage
    accuracy_decimals: 2
    
  - platform: template
    name: "Výkon zátěže"
    unit_of_measurement: "W"
    id: load_power
    accuracy_decimals: 0

  - platform: template
    name: "Napětí panelů"
    unit_of_measurement: "V"
    id: pv_voltage
    accuracy_decimals: 1

binary_sensor:
  - platform: template
    name: "Nabíjení ze sítě"
    id: charging_from_grid
  - platform: template
    name: "Stav zátěže"
    id: load_on

select:
  - platform: template
    name: "Priorita výstupu (Output Priority)"
    id: output_priority
    options:
      - "Utility First (USB)"
      - "Solar First (SUB)"
      - "SBU Priority"
    initial_option: "SBU Priority"
    optimistic: true
    set_action:
      then:
        - lambda: |-
            // Příkazy: POP00 (USB), POP01 (SUB), POP02 (SBU)
            // CRC jsou vypočtena pro formát: Příkaz + CRC + \r
            if (item == "Utility First (USB)") {
              uint8_t cmd[] = {'P', 'O', 'P', '0', '0', 0x42, 0xC5, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            } else if (item == "Solar First (SUB)") {
              uint8_t cmd[] = {'P', 'O', 'P', '0', '1', 0xD2, 0xE4, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            } else if (item == "SBU Priority") {
              uint8_t cmd[] = {'P', 'O', 'P', '0', '2', 0x12, 0x81, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            }
            ESP_LOGD("axpert", "Zmenena priorita na: %s", item.c_str());
            
interval:
  - interval: 1s
    then:
      - lambda: |-
          static std::string buffer;
          uint8_t byte;
          while (id(uart_bus).available() > 0) {
            if (id(uart_bus).read_byte(&byte)) {
              char c = (char)byte;
              if (c == '\r') {
                float v_batt, p_load, v_pv;
                char stat[9];
                // VM III Mapa: (AC_In F_In AC_Out F_Out VA_Load W_Load %_Load Bus_V V_Batt I_Char Cap T_Heat I_PV V_PV ... Status
                if (sscanf(buffer.c_str(), "(%*f %*f %*f %*f %*f %f %*f %*f %f %*f %*f %*f %*f %f %*f %*f %8s", 
                    &p_load, &v_batt, &v_pv, stat) >= 3) {
                  id(batt_voltage).publish_state(v_batt);
                  id(load_power).publish_state(p_load);
                  id(pv_voltage).publish_state(v_pv);
                  
                  // Parsování statusu (8 bitů): 
                  // bit 3 (index 3) = Nabíjení ze sítě, bit 4 (index 4) = Stav zátěže
                  if (strlen(stat) >= 8) {
                    id(charging_from_grid).publish_state(stat[3] == '1');
                    id(load_on).publish_state(stat[4] == '1');
                  }
                }
                buffer.clear();
              } else if (c != '\n') {
                buffer += c;
              }
            }
          }

  - interval: 10s
    then:
      - lambda: |-
          uint8_t qpigs[] = {'Q', 'P', 'I', 'G', 'S', 0xB7, 0xA9, 0x0D};
          id(uart_bus).write_array(qpigs, sizeof(qpigs));
