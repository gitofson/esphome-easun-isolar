text_sensor:
  - platform: template
    name: "Inverter Real Time"
    icon: "mdi:clock-check-outline"
    update_interval: 2s
    lambda: |-
      auto cal = id(sntp_time).now();
      char str[30];
      if (cal.is_valid()) {
        sprintf(str, "%02d.%02d.%d %02.0f:%02.0f:%02.0f", 
          cal.day_of_month, cal.month, cal.year,
          id(inv_hour).state, id(inv_min).state, id(inv_sec).state);
      } else {
        sprintf(str, "Syncing... %02.0f:%02.0f:%02.0f", 
          id(inv_hour).state, id(inv_min).state, id(inv_sec).state);
      }
      return {(std::string)str};
button:
  - platform: template
    entity_category: "config"
    name: "Sync Inverter Clock"
    icon: "mdi:time-sync"
    on_press:
      lambda: |-
        auto cal = id(sntp_time).now();
        if (cal.is_valid()) {
          std::vector<uint16_t> data;
          data.push_back((uint16_t)cal.hour);
          data.push_back((uint16_t)cal.minute);
          data.push_back((uint16_t)cal.second);
          auto req = esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(
            id(easun_inv), 0x02BB, 3, data);
          id(easun_inv).queue_command(req);
        }
