text_sensor:
  - platform: template
    name: "Inverter Real Time"
    icon: "mdi:clock"
    update_interval: 2s
    lambda: |-
      char str[30];
      sprintf(str, "%02.0f.%02.0f.20%02.0f %02.0f:%02.0f:%02.0f", 
        id(inv_day).state, id(inv_month).state, id(inv_year).state,
        id(inv_hour).state, id(inv_min).state, id(inv_sec).state);
      return {(std::string)str};
button:
  - platform: template
    name: "Sync Inverter Time with HA"
    icon: "mdi:time-sync"
    entity_category: "config"
    on_press:
      lambda: |-
        // Zkusíme zapsat jen sekundy na 0x02BD
        uint16_t test_sec = 15; 
        auto req = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
          id(easun_inv), 0x02BD, test_sec);
        id(easun_inv).queue_command(req);
  - platform: template
    name: "Sync Test"
    icon: "mdi:time-sync"
    entity_category: "config"            
    on_press:
      lambda: |-
        auto cal = id(sntp_time).now();
        if (cal.is_valid()) {
          // Zápis času (H:M:S) na ověřené adresy
          id(easun_inv).queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(id(easun_inv), 0x02BB, (uint16_t)cal.hour));
          id(easun_inv).queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(id(easun_inv), 0x02BC, (uint16_t)cal.minute));
          id(easun_inv).queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(id(easun_inv), 0x02BD, (uint16_t)cal.second));
          
          // Zápis data na TESTOVACÍ adresy (0x012B-0x012D)
          id(easun_inv).queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(id(easun_inv), 0x012B, (uint16_t)(cal.year - 2000)));
          id(easun_inv).queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(id(easun_inv), 0x012C, (uint16_t)cal.month));
          id(easun_inv).queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(id(easun_inv), 0x012D, (uint16_t)cal.day_of_month));
          
          ESP_LOGD("modbus_sync", "Odeslány příkazy pro synchronizaci (Single Write)");
        }
select:
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Output Priority"
    address: 0x0259 # Nechej tuto, vypadá nadějněji
    value_type: U_WORD
    use_write_multiple: yes # KLÍČOVÁ ZMĚNA - vynutí funkci 0x10 (16)
    optionsmap:
      "Solar->Utility->Battery (SUB)": 1
      "Solar->Battery->Utility (SBU)": 2
      "Solar+Utility->Battery (SUF)": 3
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Charger Source Priority"
    address: 0x0278
    value_type: U_WORD
    use_write_multiple: yes 
    optionsmap:
      "SOF - Solar-First": 1
      "SNU - Solar-And-Utility": 2     
      "OSO - Only-Solar-Only": 3    
      "SOR - Solar-Or-Utility-Return (SOR)": 4
  - platform: modbus_controller
    entity_category: "config"  # Tímto se v HA přesune do sekce nastavení
    icon: "mdi:battery-alert"
    modbus_controller_id: easun_inv
    name: "Battery Type"
    address: 0x0276
    value_type: U_WORD
    use_write_multiple: yes 
    optionsmap:
      "USE - User defined": 2
      "Li4 - Protocol 2 from inverter supplier": 6      
