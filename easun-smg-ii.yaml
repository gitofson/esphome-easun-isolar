uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 9600

time:
  - platform: sntp
    id: sntp_time
    
modbus:
  id: modbus_bus
  uart_id: uart_bus
  #timeout: 500ms

modbus_controller:
  - id: easun_inv
    address: 0x01
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 25s
    # --- PŘIDEJ TYTO ŘÁDKY ---
    command_throttle: 100ms      # Mezera mezi příkazy, aby se měnič vzpamatoval
    offline_skip_updates: 5      # Než ho úplně odřízne, zkusí to znovu

number:
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Low DC cut-off SOC"
    address: 0x0287
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    use_write_multiple: true 
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Battery Low Cut Off SOC"
    address: 0x028A
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    use_write_multiple: true 
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Low DC Recovery SOC In AC Mode"
    address: 0x0288
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    use_write_multiple: true      
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Off-grid mode bat low voltage protection point"
    address: 0x0286
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 44
    max_value: 58
    step: 0.1
    mode: box
    use_write_multiple: true     
    lambda: "return (x * 0.01) + 46.0;"
    write_lambda: "return (x - 46.0) * 100.0;"
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Mains mode bat low voltage protection point"
    address: 0x0284
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 44
    max_value: 58
    step: 0.1
    mode: box
    use_write_multiple: true     
    lambda: "return (x * 0.01) + 46.0;"
    write_lambda: "return (x - 46.0) * 100.0;"       
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Max Charging Current"
    address: 0x0280
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 0
    max_value: 160
    step: 0.1
    mode: box
    use_write_multiple: true 
    # Přepočet: Střídač (100) -> HA (10.0)
    lambda: "return x * 0.1;"
    # Přepočet: HA (10.0) -> Střídač (100)
    write_lambda: "return x * 10.0;"

  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Max Utility Charging Current"
    address: 0x0281 
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    min_value: 0
    max_value: 120
    step: 0.1
    mode: box
    use_write_multiple: true 
    # Přepočet: Střídač (100) -> HA (10.0)
    lambda: "return x * 0.1;"
    # Přepočet: HA (10.0) -> Střídač (100)
    write_lambda: "return x * 10.0;"
  - platform: modbus_controller
    modbus_controller_id: easun_inv
    name: "Floating charging voltage"
    address: 0x028C 
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    min_value: 48
    max_value: 56
    step: 0.1
    mode: box
    use_write_multiple: true 
    # Přepočet: Střídač (100) -> HA (10.0)
    lambda: "return x * 0.1;"
    # Přepočet: HA (10.0) -> Střídač (100)
    write_lambda: "return x * 10.0;"    
