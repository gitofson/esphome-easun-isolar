substitutions:
  # Tato substituce obsahuje celý blok C++ kódu pro výpočet CRC
  # Vloží se do každé lambdy, kde použiješ ${calc_crc_cpp}
  calc_crc_cpp: |-
    auto calc_crc = [](const uint8_t *data, uint16_t len) -> uint16_t {
      uint16_t crc = 0;
      static const uint16_t table[] = {
        0x0000, 0x1021, 0x2042, 0x3063, 0x4084, 0x50a5, 0x60c6, 0x70e7,
        0x8108, 0x9129, 0xa14a, 0xb16b, 0xc18c, 0xd1ad, 0xe1ce, 0xf1ef
      };
      for (uint16_t i = 0; i < len; i++) {
        uint8_t d = data[i];
        uint8_t da = ((uint8_t)(crc >> 8)) >> 4;
        crc <<= 4;
        crc ^= table[da ^ (d >> 4)];
        da = ((uint8_t)(crc >> 8)) >> 4;
        crc <<= 4;
        crc ^= table[da ^ (d & 0x0f)];
      }
      return crc;
    };
    
uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 2400
  rx_buffer_size: 512
    
sensor:
  - platform: template
    name: "Zkusebni Senzor"
    id: test_sensor
  
  - platform: template
    name: "Napětí baterie"
    unit_of_measurement: "V"
    id: batt_voltage
    accuracy_decimals: 2
    
  - platform: template
    name: "Výkon zátěže"
    unit_of_measurement: "W"
    id: load_power
    accuracy_decimals: 0

  - platform: template
    name: "Napětí panelů"
    unit_of_measurement: "V"
    id: pv_voltage
    accuracy_decimals: 1
    
  - platform: template
    name: "Návrat k baterii (P13)"
    id: back_to_full_volt
    unit_of_measurement: "V"
    accuracy_decimals: 1
    
  - platform: template
    name: "Bulk napětí (P26)"
    id: bulk_volt
    unit_of_measurement: "V"
    accuracy_decimals: 1
    
  - platform: template
    name: "Float napětí (P27)"
    id: float_volt
    unit_of_measurement: "V"
    accuracy_decimals: 1

  - platform: template
    name: "Vybíjecí proud baterie"
    id: batt_discharge_current
    unit_of_measurement: "A"
    accuracy_decimals: 0
    icon: "mdi:battery-arrow-down"

  - platform: template
    name: "Nabíjecí proud baterie"
    id: batt_charge_current
    unit_of_measurement: "A"
    icon: "mdi:battery-arrow-up"

binary_sensor:
  - platform: template
    name: "Nabíjení ze sítě"
    id: charging_from_grid
  - platform: template
    name: "Stav zátěže"
    id: load_on

select:
  - platform: template
    name: "Priorita výstupu (Output Priority)"
    id: output_priority
    options:
      - "Utility First (USB)"
      - "Solar First (SUB)"
      - "SBU Priority"
    initial_option: "SBU Priority"
#    optimistic: true
    set_action:
      then:
        - lambda: |-
            // V ESPHome 'select' šabloně je vybraný řetězec v proměnné 'x'
            if (x == "Utility First (USB)") {
              uint8_t cmd[] = {'P', 'O', 'P', '0', '0', 0x42, 0xC5, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            } else if (x == "Solar First (SUB)") {
              uint8_t cmd[] = {'P', 'O', 'P', '0', '1', 0xD2, 0xE4, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            } else if (x == "SBU Priority") {
              uint8_t cmd[] = {'P', 'O', 'P', '0', '2', 0x12, 0x81, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            }
            ESP_LOGD("axpert", "Zmenena priorita na: %s", x.c_str());

  - platform: template
    name: "Priorita nabíjení (Charger Priority)"
    id: charger_priority
    options:
      - "Only Solar (OSO)"
      - "Solar and Utility (SNU)"
      - "Solar First (CSO)"
    optimistic: true
    set_action:
      then:
        - lambda: |-
            // Kódy pro VM III: 01=CSO, 02=SNU, 03=OSO
            if (x == "Solar First (CSO)") {
              uint8_t cmd[] = {'P', 'C', 'P', '0', '1', 0xB3, 0xC8, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            } else if (x == "Solar and Utility (SNU)") {
              uint8_t cmd[] = {'P', 'C', 'P', '0', '2', 0x73, 0xAB, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            } else if (x == "Only Solar (OSO)") {
              uint8_t cmd[] = {'P', 'C', 'P', '0', '3', 0xE3, 0x8A, 0x0D};
              id(uart_bus).write_array(cmd, sizeof(cmd));
            }
            ESP_LOGD("axpert", "Zmenena priorita nabijeni na: %s", x.c_str());
            
number:
  - platform: template
    name: "Bulk nabíjení (P26)"
    id: bulk_volt_set
    mode: box
    min_value: 48.0
    max_value: 58.4
    step: 0.1
    set_action:
      then:
        - lambda: |-
            ${calc_crc_cpp}
            char cmd[20];
            sprintf(cmd, "PCVV%.1f", x); // Příkaz pro Bulk
            std::string s = cmd;
            uint16_t crc = calc_crc((const uint8_t*)s.c_str(), s.length());
            id(uart_bus).write_array((const uint8_t*)s.c_str(), s.length());
            id(uart_bus).write_byte((uint8_t)(crc >> 8));
            id(uart_bus).write_byte((uint8_t)(crc & 0xFF));
            id(uart_bus).write_byte(0x0D);

  - platform: template
    name: "Float nabíjení (P27)"
    id: float_volt_set
    mode: box
    min_value: 48.0
    max_value: 58.4
    step: 0.1
    set_action:
      then:
        - lambda: |-
            ${calc_crc_cpp}
            char cmd[20];
            sprintf(cmd, "PBFT%.1f", x); // Příkaz pro Float
            std::string s = cmd;
            uint16_t crc = calc_crc((const uint8_t*)s.c_str(), s.length());
            id(uart_bus).write_array((const uint8_t*)s.c_str(), s.length());
            id(uart_bus).write_byte((uint8_t)(crc >> 8));
            id(uart_bus).write_byte((uint8_t)(crc & 0xFF));
            id(uart_bus).write_byte(0x0D);
  - platform: template
    name: "Návrat k síti (P12)"
    id: back_to_grid_volt
    mode: box
    min_value: 44
    max_value: 51
    step: 1
    unit_of_measurement: "V"
    set_action:
      then:
        - lambda: |-
            ${calc_crc_cpp}
            char cmd[20];
            // Pro 50.0V to vytvoří přesně "PSDV500"
            sprintf(cmd, "PSDV%.0f", x); 
            std::string s = cmd;
            uint16_t crc = calc_crc((const uint8_t*)s.c_str(), s.length());

            ESP_LOGI("axpert_cmd", "Zkousim format 500: %s", s.c_str());

            id(uart_bus).write_array((const uint8_t*)s.c_str(), s.length());
            id(uart_bus).write_byte((uint8_t)(crc >> 8));
            id(uart_bus).write_byte((uint8_t)(crc & 0xFF));
            id(uart_bus).write_byte(0x0D);
              ESP_LOGI("axpert_cmd", "Odeslano: %s", s.c_str());
            // Trik: počkáme chvilku a zkusíme vyčíst, co měnič hned odpověděl
            delay(200); 
            static uint8_t resp[20];
            int i = 0;
            while(id(uart_bus).available() && i < 19) {
               id(uart_bus).read_byte(&resp[i++]);
            }
            resp[i] = '\0';
            ESP_LOGI("axpert_cmd", "Odp. měniče: %s", resp);    

  - platform: template
    name: "Max proud nabíjení ze sítě (P11)"
    id: utility_charge_current
    mode: box
    min_value: 2
    max_value: 60
    step: 10
    unit_of_measurement: "A"
    set_action:
      then:
        - lambda: |-
            ${calc_crc_cpp}
            char cmd[20];
            // VM III standard: MUCHGC + 3 číslice (002, 010, 060)
            sprintf(cmd, "MUCHGC%03.0f", x); 
            std::string s = cmd;
            uint16_t crc = calc_crc((const uint8_t*)s.c_str(), s.length());
            
            ESP_LOGI("axpert_cmd", "Zkousim: %s | CRC: %02X %02X", s.c_str(), (uint8_t)(crc >> 8), (uint8_t)(crc & 0xFF));
            
            id(uart_bus).write_array((const uint8_t*)s.c_str(), s.length());
            id(uart_bus).write_byte((uint8_t)(crc >> 8));
            id(uart_bus).write_byte((uint8_t)(crc & 0xFF));
            id(uart_bus).write_byte(0x0D);
            
            ESP_LOGI("axpert_cmd", "Odeslano: %s", s.c_str());
            // Trik: počkáme chvilku a zkusíme vyčíst, co měnič hned odpověděl
            delay(200); 
            static uint8_t resp[20];
            int i = 0;
            while(id(uart_bus).available() && i < 19) {
               id(uart_bus).read_byte(&resp[i++]);
            }
            resp[i] = '\0';
            ESP_LOGI("axpert_cmd", "Odp. měniče: %s", resp);        
            
interval:
  - interval: 1s
    then:
      - lambda: |-
          static std::string buffer;
          uint8_t byte;
          while (id(uart_bus).available() > 0) {
            if (id(uart_bus).read_byte(&byte)) {
              char c = (char)byte;
              if (c == '\r') {
                ESP_LOGI("monitor", "DELKA: %d | DATA: %s", buffer.length(), buffer.c_str());
                // 1. QPIGS - Provozní data (Délka cca 109)
                if (buffer.length() > 100) {
                  float v_batt, p_load, v_pv;
                  int i_charge, i_discharge, p_pv;
                  // Mapa: ( AC_V AC_F Out_V Out_F VA W % Bus V_Batt(9) I_Ch(10) Cap Temp I_PV V_PV(14) ... I_Disch(16) ... P_PV(21)
                  if (sscanf(buffer.c_str(), "(%*f %*f %*f %*f %*f %f %*f %*f %f %d %*d %*d %*f %f %*f %d %*s %*s %*s %*s %d", 
                      &p_load, &v_batt, &i_charge, &v_pv, &i_discharge, &p_pv) >= 4) {
                      id(batt_voltage).publish_state(v_batt);
                      id(load_power).publish_state(p_load);
                      id(pv_voltage).publish_state(v_pv);
                      id(batt_charge_current).publish_state(i_charge);
                      id(batt_discharge_current).publish_state(i_discharge);
                      id(pv_power).publish_state(p_pv); // Tvých 2185 W
                  }
                } 
                // 2. QPIRI - Nastavení (Délka cca 97)
                else if (buffer.length() > 90) {
                  int out_prio = -1, charg_prio = -1, p11 = -1;
                  float p12 = 0, p13 = 0, p26 = 0, p27 = 0;
                
                  // Krok A: Vytáhneme napětí na začátku (9, 10, 11)
                  // ( 1. 2. 3. 4. 5. 6. 7. 8. 9(P12) 10(P13_fake) 11(P26) 12(P27)
                  sscanf(buffer.c_str(), "(%*f %*f %*f %*f %*f %*f %*f %*f %f %f %f %f", &p12, &p13, &p26, &p27);
                
                  // Krok B: Vytáhneme priority a proudy (14, 17, 20)
                  // Indexy: ... 13 14(P11) 15 16 17(P16) 18 19 20(P01)
                  sscanf(buffer.c_str(), "(%*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %d %*s %*s %d %*s %*s %d", &p11, &charg_prio, &out_prio);
                
                  // Krok C: Vytáhneme skutečné P13 z konce (23. pozice)
                  sscanf(buffer.c_str(), "(%*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %*s %f", &p13);
                
                  // Odeslání do HA (jen pokud jsou hodnoty platné)
                  if (p11 > 0) id(utility_charge_current).publish_state(p11);
                  if (p12 > 0) id(back_to_grid_volt).publish_state(p12);
                  if (p13 > 0) id(back_to_full_volt).publish_state(p13);
                  if (p26 > 0) id(bulk_volt).publish_state(p26);
                  if (p27 > 0) id(float_volt).publish_state(p27);
                  
                  // Aktualizace posuvníků (Number prvků), aby v HA ukazovaly realitu
                  id(bulk_volt_set).publish_state(p26);   // P26 posuvník
                  id(float_volt_set).publish_state(p27);  // P27 posuvník
                
                  // Priority
                  if (charg_prio == 1) id(charger_priority).publish_state("Solar First (CSO)");
                  else if (charg_prio == 2) id(charger_priority).publish_state("Solar and Utility (SNU)");
                  else if (charg_prio == 3) id(charger_priority).publish_state("Only Solar (OSO)");
                
                  if (out_prio == 0) id(output_priority).publish_state("Utility First (USB)");
                  else if (out_prio == 1) id(output_priority).publish_state("Solar First (SUB)");
                  else if (out_prio == 2) id(output_priority).publish_state("SBU Priority");
                }
                buffer.clear();
              } else if (c != '\n') {
                buffer += c;
              }
            }
          }

  - interval: 10s
    then:
      - lambda: |-
          static bool toggle = false;
          if (toggle) {
            // Dotaz na data
            uint8_t qpigs[] = {'Q', 'P', 'I', 'G', 'S', 0xB7, 0xA9, 0x0D};
            id(uart_bus).write_array(qpigs, sizeof(qpigs));
          } else {
            // Dotaz na nastavení (priority)
            uint8_t qpiri[] = {'Q', 'P', 'I', 'R', 'I', 0xF8, 0x54, 0x0D};
            id(uart_bus).write_array(qpiri, sizeof(qpiri));
          }
          toggle = !toggle;
